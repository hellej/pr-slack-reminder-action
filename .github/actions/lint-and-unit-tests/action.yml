name: 'Run Lint & Unit Tests'
description: 'Run static checks and unit tests with coverage for the Go application'
  
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 #v7.1.0
      with:
        go-version-file: go.mod

    - name: Check action inputs
      shell: bash
      run: go run .github/scripts/check_inputs.go

    - name: Check formatting
      shell: bash
      run: make check-fmt

    - name: Check vet
      shell: bash
      run: make check-vet

    - name: Check style
      shell: bash
      run: make check-style

    - name: Run unit tests with coverage
      shell: bash
      run: make test-with-coverage

    - name: Check dead code
      shell: bash
      run: make check-dead-code

    - name: Check vulnerabilities
      shell: bash
      run: make check-vulnerabilities
