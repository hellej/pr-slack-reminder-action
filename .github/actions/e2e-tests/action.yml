name: 'Run E2E Tests'
description: 'Run end-to-end tests using the built action'

inputs:
  github-app-client-id:
    description: 'GitHub App client ID'
    required: true
  github-app-private-key:
    description: 'GitHub App private key'
    required: true
  slack-bot-token:
    description: 'Slack bot token for sending messages'
    required: true
  slack-channel-name-1:
    description: 'Slack channel name for test messages'
    required: false
    default: 'pr-reminders-test'
  slack-channel-name-2:
    description: 'Slack channel name for test messages grouped by repository'
    required: false
    default: 'pr-reminders-test-2'
  slack-channel-name-3:
    description: 'Slack channel name for test messages grouped by repository, without a canvas'
    required: false
    default: 'pr-reminders-test-3'

runs:
  using: composite
  steps:
    - name: Generate GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        owner: ${{ github.repository_owner }}

    - name: Basic run
      uses: ./
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        slack-bot-token: ${{ inputs.slack-bot-token }}
        slack-channel-name: ${{ inputs.slack-channel-name-1 }}
        state-artifact-name: pr-slack-reminder-e2e-basic-state
        github-user-slack-user-id-mapping: |
          hellej: U08SZJTJF0U
          bob: U08EVPGNWER

    - name: Multi-repository run
      uses: ./
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        slack-bot-token: ${{ inputs.slack-bot-token }}
        slack-channel-name: ${{ inputs.slack-channel-name-1 }}
        state-artifact-name: pr-slack-reminder-e2e-multi-repo-state
        github-repositories: |
          hellej/pr-slack-reminder-action
          hellej/pr-slack-reminder-test-repo-1
          hellej/pr-slack-reminder-test-repo-2
        github-user-slack-user-id-mapping: |
          hellej: U08SZJTJF0U
          bob: U08EVPGNWER
        old-pr-threshold-hours: 48

    - name: Run with canvas link
      uses: ./
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        slack-bot-token: ${{ inputs.slack-bot-token }}
        slack-channel-name: ${{ inputs.slack-channel-name-1 }}
        state-artifact-name: pr-slack-reminder-e2e-canvas-state
        github-repositories: |
          hellej/pr-slack-reminder-action
          hellej/pr-slack-reminder-test-repo-1
          hellej/pr-slack-reminder-test-repo-2
        old-pr-threshold-hours: 48
        pr-tracker-canvas-link: https://hellej.slack.com/docs/T08SGDGNB2B/F0BMEPVR1DL

    - name: Run with filters without canvas link
      uses: ./
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        slack-bot-token: ${{ inputs.slack-bot-token }}
        slack-channel-name: ${{ inputs.slack-channel-name-3 }}
        state-artifact-name: pr-slack-reminder-e2e-grouped-state
        github-repositories: |
          hellej/pr-slack-reminder-action
          hellej/pr-slack-reminder-test-repo-1
          hellej/pr-slack-reminder-test-repo-2
        old-pr-threshold-hours: 48
        group-by-repository: true
        filters: |
          {
            "ignored-labels": ["ignore-reminder"]
          }
        repository-filters: |
          hellej/pr-slack-reminder-test-repo-1: {"ignored-authors": ["alice"]}
          hellej/pr-slack-reminder-test-repo-2: {}

    - name: 'Run with filters and canvas link: post'
      uses: ./
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        slack-bot-token: ${{ inputs.slack-bot-token }}
        slack-channel-name: ${{ inputs.slack-channel-name-2 }}
        state-artifact-name: pr-slack-reminder-e2e-grouped-canvas-state
        github-repositories: |
          hellej/pr-slack-reminder-action
          hellej/pr-slack-reminder-test-repo-1
          hellej/pr-slack-reminder-test-repo-2
        old-pr-threshold-hours: 48
        group-by-repository: true
        filters: |
          {
            "ignored-labels": ["ignore-reminder"]
          }
        repository-filters: |
          hellej/pr-slack-reminder-test-repo-1: {"ignored-authors": ["alice"]}
          hellej/pr-slack-reminder-test-repo-2: {}
        pr-tracker-canvas-link: https://hellej.slack.com/docs/T08SGDGNB2B/F0BSUKTNB3J

    - name: 'Run with filters and canvas link: upload post state'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: pr-slack-reminder-e2e-grouped-canvas-state
        path: pr-slack-reminder-state.json
        retention-days: 1

    - name: 'Run with filters and canvas link: update'
      uses: ./
      with:
        run-mode: update
        github-token: ${{ steps.app-token.outputs.token }}
        slack-bot-token: ${{ inputs.slack-bot-token }}
        slack-channel-name: ${{ inputs.slack-channel-name-2 }}
        state-artifact-name: pr-slack-reminder-e2e-grouped-canvas-state
        github-repositories: |
          hellej/pr-slack-reminder-action
          hellej/pr-slack-reminder-test-repo-1
          hellej/pr-slack-reminder-test-repo-2
        old-pr-threshold-hours: 48
        group-by-repository: true
        filters: |
          {
            "ignored-labels": ["ignore-reminder"]
          }
        repository-filters: |
          hellej/pr-slack-reminder-test-repo-1: {"ignored-authors": ["alice"]}
          hellej/pr-slack-reminder-test-repo-2: {}
        pr-tracker-canvas-link: https://hellej.slack.com/docs/T08SGDGNB2B/F0BSUKTNB3J

    - name: 'Run with filters and canvas link: upload update state'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: pr-slack-reminder-e2e-grouped-canvas-state
        path: pr-slack-reminder-state.json
        retention-days: 1
        overwrite: true
