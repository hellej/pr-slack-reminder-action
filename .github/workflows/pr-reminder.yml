name: PR Reminder

on:
  workflow_dispatch:
    inputs:
      run-mode:
        description: 'Run mode'
        type: choice
        options:
          - post
          - update
        required: true
      build-first:
        description: 'Build the project first'
        type: boolean
        default: false
        required: false
  schedule:
    - cron: '0 9 * * 0-6'  # at 09:00 every day
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, review_requested]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, deleted]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || 'other' }}
  cancel-in-progress: false

jobs:
  reminder:
    if: false # TEMPORARY PROBE
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Build application
        if: inputs.build-first
        uses: ./.github/actions/build

      - name: Send PR reminder
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-bot-token: ${{ secrets.DEV_SLACK_TOKEN }}
          run-mode: ${{ (github.event_name == 'schedule' || inputs.run-mode == 'post') && 'post' || 'update' }}
          slack-channel-name: github
          github-user-slack-user-id-mapping: |
            hellej: U08SZJTJF0U
            bob: U08EVPGNWER
          pr-tracker-canvas-link: https://hellej.slack.com/docs/T08SGDGNB2B/F0BPS4FKCEL
      
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: pr-slack-reminder-state
          path: pr-slack-reminder-state.json
          retention-days: 4

  probe-pull-requests-read-only:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Probe check status fields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "::group::PullRequest.statusCheckRollup with isRequired"
          gh api graphql -f owner=hellej -f name=pr-slack-reminder-action -F number=99 -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            rateLimit { cost remaining }
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                mergeStateStatus
                reviewDecision
                mergeable
                statusCheckRollup {
                  state
                  contexts(first: 100) {
                    totalCount
                    pageInfo { hasNextPage }
                    nodes {
                      __typename
                      ... on CheckRun { name status conclusion isRequired(pullRequestNumber: $number) }
                      ... on StatusContext { context state isRequired(pullRequestNumber: $number) }
                    }
                  }
                }
              }
            }
          }'
          echo "::endgroup::"
          echo "::group::commits(last: 1) path"
          gh api graphql -f owner=hellej -f name=pr-slack-reminder-action -F number=99 -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            rateLimit { cost remaining }
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                commits(last: 1) { nodes { commit { statusCheckRollup { state contexts(first: 100) { nodes { __typename ... on CheckRun { name conclusion isRequired(pullRequestNumber: $number) } } } } } } }
              }
            }
          }'
          echo "::endgroup::"
          echo "::group::control: fields known to work under pull-requests read"
          gh api graphql -f owner=hellej -f name=pr-slack-reminder-action -F number=99 -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) { mergeable reviewThreads(first: 1) { totalCount } }
            }
          }'
          echo "::endgroup::"

  probe-with-checks-and-statuses:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Probe check status fields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "::group::PullRequest.statusCheckRollup with isRequired"
          gh api graphql -f owner=hellej -f name=pr-slack-reminder-action -F number=99 -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            rateLimit { cost remaining }
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                mergeStateStatus
                reviewDecision
                mergeable
                statusCheckRollup {
                  state
                  contexts(first: 100) {
                    totalCount
                    pageInfo { hasNextPage }
                    nodes {
                      __typename
                      ... on CheckRun { name status conclusion isRequired(pullRequestNumber: $number) }
                      ... on StatusContext { context state isRequired(pullRequestNumber: $number) }
                    }
                  }
                }
              }
            }
          }'
          echo "::endgroup::"
          echo "::group::commits(last: 1) path"
          gh api graphql -f owner=hellej -f name=pr-slack-reminder-action -F number=99 -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            rateLimit { cost remaining }
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                commits(last: 1) { nodes { commit { statusCheckRollup { state contexts(first: 100) { nodes { __typename ... on CheckRun { name conclusion isRequired(pullRequestNumber: $number) } } } } } } }
              }
            }
          }'
          echo "::endgroup::"
          echo "::group::control: fields known to work under pull-requests read"
          gh api graphql -f owner=hellej -f name=pr-slack-reminder-action -F number=99 -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) { mergeable reviewThreads(first: 1) { totalCount } }
            }
          }'
          echo "::endgroup::"
