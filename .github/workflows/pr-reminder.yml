name: PR Reminder

on:
  workflow_dispatch:
    inputs:
      run-mode:
        description: 'Run mode'
        type: choice
        options:
          - post
          - update
        required: true
      build-first:
        description: 'Build the project first'
        type: boolean
        default: false
        required: false
  schedule:
    - cron: '0 9 * * 0-6'  # at 09:00 every day
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, review_requested]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, deleted]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || 'other' }}
  cancel-in-progress: false

jobs:
  reminder:
    if: false # TEMPORARY PROBE
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Build application
        if: inputs.build-first
        uses: ./.github/actions/build

      - name: Send PR reminder
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-bot-token: ${{ secrets.DEV_SLACK_TOKEN }}
          run-mode: ${{ (github.event_name == 'schedule' || inputs.run-mode == 'post') && 'post' || 'update' }}
          slack-channel-name: github
          github-user-slack-user-id-mapping: |
            hellej: U08SZJTJF0U
            bob: U08EVPGNWER
          pr-tracker-canvas-link: https://hellej.slack.com/docs/T08SGDGNB2B/F0BPS4FKCEL
      
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: pr-slack-reminder-state
          path: pr-slack-reminder-state.json
          retention-days: 4

  probe-pull-requests-read-only:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Probe stale approval fields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api graphql -f owner=hellej -f name=pr-slack-reminder-action -F number=52 -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            rateLimit { cost remaining }
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                headRefOid
                reviewDecision
                reviews(last: 100) { nodes { state commit { oid } author { login __typename } } }
                reviewDismissals: timelineItems(itemTypes: [REVIEW_DISMISSED_EVENT], last: 100) {
                  nodes { ... on ReviewDismissedEvent {
                    previousReviewState
                    pullRequestCommit { id }
                    review { author { login __typename ... on User { name } } }
                  } }
                }
              }
            }
          }'
