# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - ".github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  # Go records a tool module as // indirect, which version updates skip by default.
  # Keep this list in sync with the tool block of tools/go.mod.
  # See docs/third-party-facts.md § Dependabot skips Go tool directive modules unless allow-listed
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "golang.org/x/tools"
        dependency-type: "all"
      - dependency-name: "golang.org/x/vuln"
        dependency-type: "all"
      - dependency-name: "github.com/mattn/goveralls"
        dependency-type: "all"
    groups:
      dev-tools:
        patterns: ["*"]
